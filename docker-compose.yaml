services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"   # REST + dashboard at http://localhost:6333/dashboard; no API key, so local only
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has bash but no curl or wget: open a TCP connection instead.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 2s
      retries: 30

  # API and UI on http://localhost:8000: `docker compose --profile app up --build`.
  app:
    profiles: [app]
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # the API has no authentication
    env_file:
      - path: .env
        required: false
    environment:   # these win over .env
      QDRANT_URL: http://qdrant:6333
      DB_PATH: /app/state/harness.db
    volumes:
      - harness_state:/app/state
    depends_on:
      qdrant:
        condition: service_healthy   # ingest runs at startup

volumes:
  qdrant_data:
  harness_state:
