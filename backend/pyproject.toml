[project]
name = "ops-agent-harness"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "pyyaml",
    "aiosqlite>=0.22.1",
    "openai>=3.19.2,<4",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "qdrant-client>=1.19.1,<2",
    "ragas>=0.4.3,<0.5",
    "instructor>=1.17.0,<2",
    "langchain-community>=0.4.1,<0.4.2",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx2", "ruff"]

[tool.uv]
package = false
# instructor 1.17.0 (pulled by ragas) pins jiter<0.15, openai 3.19.2 needs >=0.16. instructor only uses
# jiter.from_json for streamed partial parsing, which the judge never does. Drop when instructor lifts the pin.
override-dependencies = ["jiter>=0.16,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["live: needs a real embedding endpoint or judge; skipped when it does not answer"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "DTZ"]  # DTZ: no naive datetimes
